<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Task</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        .header h3 {
            margin: 0;
            color: #333;
        }
        .header a {
            background-color: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
        }
        .status {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px;
        }
        .processing {
            background-color: #f8d7da;
            color: #721c24;
        }
        .completed {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>Processing Your Recommendations</h3>
        {% if 'user' in session %}
        <a href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </div>

    <div class="status">
        <h2>Processing Your Recommendations...</h2>
        <p>We are generating personalized fashion recommendations for you. This might take a moment.</p>

        <!-- You can add an animated spinner or a loading icon here -->
        <img src="https://loading.io/spinners/spiral/index.svg" alt="Loading...">

    </div>

</body>
</html>
